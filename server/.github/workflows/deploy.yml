name: Deploy to Prisma Compute

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Diagnose DB connectivity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "runner egress IP: $(curl -4 -sS --max-time 10 https://api.ipify.org || echo failed)"
          echo "--- URL shape ---"
          node -e '
            const u = new URL(process.env.DATABASE_URL);
            console.log("protocol:", u.protocol);
            console.log("host:", u.host);
            console.log("user:", (u.username||"").slice(0,20)+"...");
            console.log("database:", (u.pathname||"").replace(/^\//,""));
            console.log("query:", u.search.replace(/password=([^&]*)/gi, "password=***"));
          '
          echo "--- TCP test ---"
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/pooled.db.prisma.io/5432' && echo "TCP OK" || echo "TCP FAIL"
          echo "--- pg connect test ---"
          node -e '
            const { Client } = require("pg");
            const c = new Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 10000 });
            c.connect().then(()=>{ console.log("PG CONNECT OK"); return c.end(); })
              .catch(e=>{ console.log("PG CONNECT FAIL:", e.code || "", e.message || e); process.exit(1); });
          ' || true

      - name: Apply production migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Deploy (main -> production)
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
        run: |
          npx --yes @prisma/cli@latest app deploy \
            --project proj_cmshtk0vb2a7kxnfvrtn1xhgt \
            --branch main \
            --app server \
            --prod \
            --yes \
            --json