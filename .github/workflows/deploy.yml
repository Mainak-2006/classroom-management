name: Deploy to Prisma Compute

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Apply production migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Apply test migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
        run: npx prisma migrate deploy

      - name: Write production env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          {
            echo "PORT=3000"
            echo "DATABASE_URL=\"$DATABASE_URL\""
            echo "JWT_SECRET=\"${JWT_SECRET:-naruhina@143}\""
            echo "JWT_REFRESH_SECRET=\"${JWT_REFRESH_SECRET:-naruhina_refresh@143}\""
            if [ -n "$CORS_ORIGINS" ]; then echo "CORS_ORIGINS=\"$CORS_ORIGINS\""; fi
            echo "SEED_DEFAULT_ADMIN=true"
            echo "SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@example.com}"
            echo "SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin123}"
          } > .env.compute.prod

      - name: Write test env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          {
            echo "PORT=3000"
            echo "DATABASE_URL=\"$DATABASE_URL\""
            echo "JWT_SECRET=\"${JWT_SECRET:-naruhina@143}\""
            echo "JWT_REFRESH_SECRET=\"${JWT_REFRESH_SECRET:-naruhina_refresh@143}\""
            if [ -n "$CORS_ORIGINS" ]; then echo "CORS_ORIGINS=\"$CORS_ORIGINS\""; fi
            echo "SEED_DEFAULT_ADMIN=true"
            echo "SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@example.com}"
            echo "SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin123}"
          } > .env.compute.test

      - name: Deploy (production)
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
        run: |
          npx --yes @prisma/cli@3.0.0-beta.30 app deploy \
            --project proj_ourgii7wts43ju9kbnijy9wv \
            --branch main \
            --prod \
            --yes \
            --json \
            --env .env.compute.prod

      - name: Deploy (test)
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
        run: |
          npx --yes @prisma/cli@3.0.0-beta.30 app deploy \
            --project proj_g4az4m2s701yskth2l5cyjwb \
            --branch main \
            --prod \
            --yes \
            --json \
            --env .env.compute.test
