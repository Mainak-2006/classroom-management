name: Deploy to Prisma Compute

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Apply production migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Apply test migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
        run: npx prisma migrate deploy

      - name: Deploy (production)
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
        run: |
          bunx @prisma/cli@3.0.0-beta.30 app deploy \
            --project proj_ourgii7wts43ju9kbnijy9wv \
            --branch main \
            --prod \
            --yes \
            --json

      - name: Deploy (test)
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
        run: |
          bunx @prisma/cli@3.0.0-beta.30 app deploy \
            --project proj_g4az4m2s701yskth2l5cyjwb \
            --branch main \
            --prod \
            --yes \
            --json
