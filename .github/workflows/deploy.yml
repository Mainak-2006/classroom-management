name: Deploy to Prisma Compute

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Diagnose DB connectivity
        run: |
          echo "runner egress IP: $(curl -4 -sS --max-time 10 https://api.ipify.org || echo failed)"
          echo "--- DNS ---"
          getent hosts pooled.db.prisma.io || echo "dns failed"
          echo "--- TCP test ---"
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/pooled.db.prisma.io/5432' && echo "TCP OK" || echo "TCP FAIL"
          echo "--- direct host ---"
          getent hosts db.prisma.io || echo "direct dns failed"
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/db.prisma.io/5432' && echo "TCP direct OK" || echo "TCP direct FAIL"

      - name: Apply production migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Deploy (main -> production)
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
        run: |
          npx --yes @prisma/cli@latest app deploy \
            --project proj_cmshtk0vb2a7kxnfvrtn1xhgt \
            --branch main \
            --app server \
            --prod \
            --yes \
            --json